      operationId: domainLookupPost
      summary: Enrich domains with TLD metadata and DNS presence flags
      description: >
        Returns TLD category, region, dnsCheck booleans, and WHOIS link metadata. Single domain returns an object; batch
        array (max 50) returns an array. Invalid domains return per-item errors without failing the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  description: Single domain string or array (max 50)
                  oneOf:
                    - type: string
                      example: stripe.com
                    - type: array
                      items:
                        type: string
                      maxItems: 50
            example:
              domain: stripe.com
      responses:
        "200":
          description: Domain enrichment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                domain: stripe.com
                tld: com
                category: commercial
                region: Global
                dnsCheck:
                  hasA: true
                  hasAAAA: true
                  hasMX: true
                  hasTXT: true
                whois:
                  available: true
                  url: https://datpaq.com/whois?domain=stripe.com
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /mx-lookup:
    get:
      tags:
        - MX Lookup
      operationId: mxLookupGet
      summary: Look up MX records for one or more domains (GET)
      description: |
        Returns priority-sorted MX records with optional IP resolution, SMTP port 25 checks, and SPF parsing.
      parameters:
        - name: domains
          in: query
          required: true
          description: >
            Domains to check. Note the parameter name is plural (`domains`, not `domain`), even for a single domain.
            Accepts one domain or a comma-separated list (max 50).
          schema:
            type: string
            example: gmail.com
        - name: resolveIps
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: validateSmtp
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeSpf
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: MX lookup results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                - domain: gmail.com
                  mxRecords:
                    - priority: 5
                      exchange: gmail-smtp-in.l.google.com
                      ipAddresses:
                        - 142.250.102.27
                      smtpOpen: true
                  spf:
                    record: v=spf1 include:_spf.google.com ~all
                    includes:
                      - _spf.google.com
                    mechanism: ~all
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - MX Lookup
      operationId: mxLookupPost
      summary: Look up MX records for one or more domains (POST)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
              properties:
                domains:
                  oneOf:
                    - type: string
                      example: gmail.com
                    - type: array
                      items:
                        type: string
                      maxItems: 50
                resolveIps:
                  type: boolean
                  default: true
                validateSmtp:
                  type: boolean
                  default: false
                includeSpf:
                  type: boolean
                  default: false
            example:
              domains:
                - gmail.com
                - protonmail.com
              resolveIps: true
              validateSmtp: true
              includeSpf: true
      responses:
        "200":
          description: MX lookup results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                count: 2
                data:
                  - domain: gmail.com
                    mxRecords:
                      - priority: 5
                        exchange: gmail-smtp-in.l.google.com
                  - domain: protonmail.com
                    mxRecords:
                      - priority: 10
                        exchange: mail.protonmail.ch
                processingTime: 12ms
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
