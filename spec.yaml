          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /dns-lookup:
    get:
      tags:
        - DNS Lookup
      operationId: dnsLookup
      summary: Resolve DNS records for domains or reverse PTR for IPs
      description: >
        Forward DNS for A, AAAA, MX, TXT, NS, CNAME, and SOA records. Reverse lookup via ip for PTR. Batch domains by
        repeating the domain parameter. Default record type is A; use ALL for every supported type.
      parameters:
        - name: domain
          in: query
          required: false
          description: Domain to resolve (repeat for batch)
          schema:
            oneOf:
              - type: string
                example: example.com
              - type: array
                items:
                  type: string
        - name: ip
          in: query
          required: false
          description: IP address for reverse PTR lookup
          schema:
            type: string
            example: 8.8.8.8
        - name: type
          in: query
          required: false
          description: DNS record type
          schema:
            type: string
            enum:
              - A
              - AAAA
              - MX
              - TXT
              - NS
              - CNAME
              - SOA
              - PTR
              - ALL
            default: A
      responses:
        "200":
          description: DNS record results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                - domain: example.com
                  records:
                    MX:
                      - exchange: mail.example.com
                        priority: 10
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
