          required: false
          description: auto, celsius, or fahrenheit
          schema:
            type: string
            enum:
              - auto
              - celsius
              - fahrenheit
            example: auto
  /weather/forecast:
    get:
      tags:
        - Weather
      operationId: weatherForecast
      summary: Current conditions plus forecast
      description: Requires lat and lon. forecastDays defaults to 7 (max 14).
      responses:
        "200":
          description: Current conditions and forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                location:
