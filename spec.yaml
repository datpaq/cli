  /web-scraping/scrape:
    post:
      tags:
        - Web Scraping
      operationId: webScrapingScrape
      summary: Synchronously scrape a public URL
      description: >
        Returns page content in the requested formats. SSRF-guarded. Default format is markdown with Readability
        main-content extraction enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  example: https://example.com/article
                formats:
                  type: array
                  items:
                    type: string
                    enum:
                      - markdown
                      - html
                      - rawHtml
                      - links
                      - images
                      - screenshot
                  default:
                    - markdown
                onlyMainContent:
                  type: boolean
                  default: true
                waitUntil:
                  type: string
                  enum:
                    - load
                    - domcontentloaded
                    - networkidle0
                    - networkidle2
                  default: domcontentloaded
                waitFor:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  default: 0
                includeTags:
                  type: array
                  items:
                    type: string
                excludeTags:
                  type: array
                  items:
                    type: string
            example:
              url: https://example.com/article
              formats:
                - markdown
      responses:
        "200":
          description: Scraped page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                url: https://example.com/article
                title: Article Title
                text: Plain text content...
                excerpt: Summary...
                byline: null
                siteName: Example
                length: 1200
                content: <article>...</article>
                markdown: |-
                  # Article Title

                  Plain text content...
                metadata:
                  timingMs: 3500
                  cached: false
                correlationId: req_abc123
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
