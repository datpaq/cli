          description: Longitude
          schema:
            type: number
            example: -74.006
        - name: units
          in: query
          required: false
          description: auto, celsius, or fahrenheit
          schema:
            type: string
            enum:
              - auto
              - celsius
              - fahrenheit
            example: auto
        - name: forecastDays
          in: query
